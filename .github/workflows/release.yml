name: Release

# Tag-driven, like coa-reviewer: pushing a `v*` tag tests, builds and publishes
# the release the ASAPSV1 updater installs. See RELEASING.md.
on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the publish job gets a token that can write, and
# it runs no test code.
permissions:
  contents: read

# One release at a time, and never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same checks as every push (.github/workflows/ci.yml). A red suite never
  # releases.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Creating a release needs this. Without it a repo whose default token is
    # read-only fails late with a confusing 403 from `gh release`.
    permissions:
      contents: write

    steps:
      # A fresh checkout of the tag. The token is not written into .git/config;
      # gh reads it from GH_TOKEN in the one step that needs it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # scripts/package_release.sh is the single source of truth for what a
      # release contains: it stamps VERSION from the tag, packages tracked
      # files only, refuses if state leaked in or a required file is missing,
      # and writes the zip and its sha256 (verified before it exits).
      # tests/test_release_package.py tests the same script.
      - name: Build zip and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/package_release.sh "$TAG" dist
          ls -l dist

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A quoted heredoc, so backticks and backslashes in the notes are
          # literal.
          cat > dist/notes.md <<'NOTES_END'
          Automated release of GC Hub.

          The updater on ASAPSV1 unpacks this into `C:\ASAPApps\gc\releases\<tag>\`
          and points the `current` junction at it once `/healthz` passes. State
          lives in `C:\ASAPApps\gc\data\` and is deliberately not part of this
          archive.

          Verify the asset before use:
          ```
          sha256sum -c gc-hub-<tag>.zip.sha256
          ```
          NOTES_END
          sed -i "s/<tag>/$TAG/g" dist/notes.md
          cat dist/notes.md

      # Safe to re-run. A release that already has its checksum asset is
      # complete (the updater may already have installed it), so it is left
      # alone. Anything else under this tag is a partial or draft release from
      # a failed run: delete it, keep the tag, and create it again.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qxF "gc-hub-$TAG.zip.sha256"; then
            echo "Release $TAG already has gc-hub-$TAG.zip.sha256; leaving it untouched."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting partial release $TAG (the tag stays)."
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            "dist/gc-hub-$TAG.zip" \
            "dist/gc-hub-$TAG.zip.sha256" \
            --title "$TAG" \
            --notes-file dist/notes.md \
            --verify-tag
