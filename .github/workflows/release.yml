name: Release

# Tag-driven, like coa-reviewer: pushing a `v*` tag builds, tests and publishes
# the release the ASAPSV1 updater installs. See RELEASING.md.
on:
  push:
    tags:
      - 'v*'

# Creating a release needs this. On a repo whose default workflow token is
# read-only, omitting it fails late with a confusing 403 from `gh release`.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # The pinned set the release will ship. netCDF4's manylinux wheel
          # bundles HDF5/netCDF, so no system packages are needed.
          pip install -r requirements.txt -r requirements-dev.txt

      # A red suite never releases. The subprocess boot tests bind localhost
      # ports, which is fine on a runner; tests that compare against a
      # ../coa-reviewer checkout skip because it is absent here.
      - name: Python tests
        run: python -m pytest tests/ -q

      - name: JavaScript tests
        run: node tests/js/run.js

      # scripts/package_release.sh is the single source of truth for what a
      # release contains: it stamps VERSION from the tag, refuses to package if
      # state leaked in or a required file is missing, and writes the zip and
      # its sha256 (verified before it exits). tests/test_release_package.py
      # tests the same script.
      - name: Build zip and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/package_release.sh "$TAG" dist
          ls -l dist

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A quoted heredoc, so backticks and backslashes in the notes are
          # literal.
          cat > dist/notes.md <<'NOTES_END'
          Automated release of GC Hub.

          The updater on ASAPSV1 unpacks this into `C:\ASAPApps\gc\releases\<tag>\`
          and points the `current` junction at it once `/healthz` passes. State
          lives in `C:\ASAPApps\gc\data\` and is deliberately not part of this
          archive.

          Verify the asset before use:
          ```
          sha256sum -c gc-hub-<tag>.zip.sha256
          ```
          NOTES_END
          sed -i "s/<tag>/$TAG/g" dist/notes.md
          cat dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/gc-hub-$TAG.zip" \
            "dist/gc-hub-$TAG.zip.sha256" \
            --title "$TAG" \
            --notes-file dist/notes.md
