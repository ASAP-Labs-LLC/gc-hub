name: Hub tray CI

# The hub tray (tray/) runs on ASAPSV1 with the release's .venv (CPython 3.14,
# Windows). Its suite (tests/tray) is stdlib + pytest; on Windows it also
# builds the menu with the real pystray, as pinned in requirements.txt. ci.yml
# runs it on Linux with everything else.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tray-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tray-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install test dependencies (Windows, the release pins)
        if: runner.os == 'Windows'
        run: python -m pip install pytest pystray==0.19.5 Pillow==12.3.0 six==1.17.0

      - name: Install test dependencies (Linux)
        if: runner.os != 'Windows'
        run: python -m pip install pytest Pillow==12.3.0

      - name: Tray tests
        run: python -m pytest tests/tray -q -rs
